spring.application.name=demo

# Conexion a PostgreSQL (BD principal en desarrollo/produccion)
spring.datasource.url=jdbc:postgresql://localhost:5432/portfolio
spring.datasource.username=matias_admin
spring.datasource.password=password_seguro_dev
spring.datasource.driver-class-name=org.postgresql.Driver

# spring.sql.init.mode=always asegura que los scripts schema.sql y data.sql se ejecuten siempre al iniciar.
# Esto es util para desarrollo y pruebas para mantener la base de datos en un estado consistente.
# OJO: en produccion conviene cambiarlo a "never" para no borrar datos reales.
spring.sql.init.mode=always

# Nota: NO usamos spring.jpa.* porque este proyecto trabaja con JdbcTemplate puro (sin Hibernate/JPA).
# Si en el futuro migras a Spring Data JPA podrias agregar:
#   spring.jpa.hibernate.ddl-auto=update
#   spring.jpa.show-sql=true

# Logging mas verboso para ver SQL en consola (util cuando estas aprendiendo)
logging.level.org.springframework.jdbc.core.JdbcTemplate=DEBUG

# Patron de logs que incluye el requestId del MDC entre corchetes.
# %X{requestId} busca en el MDC el valor con clave "requestId" que pone el RequestIdFilter.
# Cuando no hay requestId (ej: logs al arrancar la app), simplemente aparece vacio.
# Formato: hora [requestId] nivel logger - mensaje
logging.pattern.console=%d{HH:mm:ss.SSS} [%X{requestId}] %-5level %logger{36} - %msg%n
