# Configuracion exclusiva para tests (perfil "test").
# Se activa con @ActiveProfiles("test") en cada clase de test.

# H2 en memoria. DB_CLOSE_DELAY=-1 mantiene la BD viva mientras corre la JVM.
spring.datasource.url=jdbc:h2:mem:portfolio_test;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# Limpia explicitamente schema/data-locations para NO cargar el schema.sql principal
# (que ademas tiene INSERTs con datos demo de Juan Perez que no queremos en tests).
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema-h2.sql
spring.sql.init.data-locations=

logging.level.org.springframework.jdbc=WARN
logging.level.org.springframework.web=WARN
